<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 자동화 · HL Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@9.5.3/dist/index.umd.cjs" 
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/docx@9.5.3/dist/index.umd.cjs'">
</script>
<style>
:root{
  --bg:#0a0c10;--surface:#111318;--surface2:#181c24;--border:#1e2330;
  --border-light:#252d3d;--text:#e8eaf0;--text-muted:#6b7494;--text-dim:#3d4560;
  --accent:#2b5ce6;--accent-glow:rgba(43,92,230,.15);
  --hl-blue:#1a7bdc;--hl-green:#16a34a;
  --hl-blue-bg:rgba(26,123,220,.08);--hl-green-bg:rgba(22,163,74,.08);
  --font-kr:'Noto Sans KR',sans-serif;--font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-kr);min-height:100vh;font-size:14px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(43,92,230,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(43,92,230,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:48px 24px 80px}
.header{margin-bottom:40px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-glow);border:1px solid rgba(43,92,230,.3);color:#7ba5f8;font-size:11px;font-family:var(--font-mono);letter-spacing:.08em;padding:4px 12px;border-radius:2px;margin-bottom:16px}
.badge::before{content:'';width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.header-sub{color:var(--text-muted);font-size:13px;font-weight:300}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:14px}
.card-label{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-label::before{content:'';width:3px;height:12px;background:var(--accent);border-radius:2px}
.form-group{margin-bottom:13px}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border-light);border-radius:4px;color:var(--text);font-family:var(--font-kr);font-size:13px;padding:9px 13px;transition:border-color .2s;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pblock{background:var(--surface2);border:1px solid var(--border-light);border-radius:4px;overflow:hidden}
.plabel{padding:7px 11px;font-size:11px;font-family:var(--font-mono);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.plabel.cl{background:var(--hl-blue-bg);color:#7ba5f8;border-bottom:1px solid rgba(43,92,230,.2)}
.plabel.ag{background:var(--hl-green-bg);color:#6ee7b7;border-bottom:1px solid rgba(22,163,74,.2)}
.dot{width:6px;height:6px;border-radius:50%}
.cl .dot{background:var(--hl-blue)}.ag .dot{background:var(--hl-green)}
.pblock textarea{border:none;border-radius:0;background:transparent;min-height:80px;font-size:12px}
.pblock textarea:focus{box-shadow:none;border-color:transparent}
.ta-wrap{position:relative}
.ta-wrap textarea{min-height:220px;font-family:var(--font-mono);font-size:12px}
.char-count{position:absolute;bottom:9px;right:12px;font-size:10px;color:var(--text-dim);font-family:var(--font-mono);pointer-events:none}
.tip{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:4px;padding:11px 15px;font-size:12px;color:#fbbf24;margin-top:11px;line-height:1.6}
.btn-gen{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-family:var(--font-kr);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:-.01em;margin-top:4px}
.btn-gen:hover:not(:disabled){background:#3d6df0;transform:translateY(-1px);box-shadow:0 8px 24px rgba(43,92,230,.35)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.status-area{display:none;margin-top:18px}.status-area.on{display:block}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 22px}
.steps{display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--text-dim);transition:all .3s}
.step.active{color:var(--text)}.step.done{color:#4ade80}.step.err{color:#f87171}
.sicon{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .3s}
.step.active .sicon{border-color:var(--accent);background:var(--accent-glow)}
.step.done .sicon{border-color:#4ade80;background:rgba(74,222,128,.1);color:#4ade80}
.step.err .sicon{border-color:#f87171;background:rgba(248,113,113,.1);color:#f87171}
.spin{width:11px;height:11px;border:1.5px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);border-radius:4px;padding:11px 15px;font-size:12.5px;color:#fca5a5;margin-top:11px;display:none}
.preview-area{display:none;margin-top:18px}.preview-area.on{display:block}
.pbox{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.ptitle{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:.05em}
.btn-dl{display:flex;align-items:center;gap:6px;padding:7px 16px;background:transparent;border:1px solid var(--accent);color:#7ba5f8;border-radius:4px;font-size:12px;font-family:var(--font-kr);cursor:pointer;transition:all .2s}
.btn-dl:hover{background:var(--accent-glow)}
.pcontent{padding:22px;font-size:13px;line-height:1.85;max-height:560px;overflow-y:auto;white-space:pre-wrap}
.st{color:#7ba5f8;font-weight:700;font-size:11px;letter-spacing:.08em;font-family:var(--font-mono);margin-top:18px;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border);display:block}
.bl{color:#7ba5f8}.gr{color:#6ee7b7}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="badge">INTERNAL TOOL · HL GROUP</div>
    <h1>회의록 자동화</h1>
    <p class="header-sub">클로바노트 회의록 텍스트 → 공식 양식 DOCX 자동 변환</p>
  </header>
  <div class="card">
    <div class="card-label">회의 기본 정보</div>
    <div class="form-row">
      <div class="form-group"><label>고객사</label><input id="client" value="HL그룹"></div>
      <div class="form-group"><label>작성자</label><input id="author" placeholder="예: 오선민 팀장"></div>
    </div>
    <div class="form-group"><label>회의 제목</label><input id="title" placeholder="예: HL 사내채널 월간 합동 미팅 (3/5)"></div>
    <div class="form-group"><label>작성일자</label><input id="date" placeholder="자동 입력 (예: 2025. 03. 05)"></div>
  </div>
  <div class="card">
    <div class="card-label">참석자</div>
    <div class="pgrid">
      <div class="pblock">
        <div class="plabel cl"><span class="dot"></span>HL그룹 (고객사)</div>
        <textarea id="cpx" placeholder="이영호 프런티어팀 팀장&#10;유아진 프로&#10;박희라 책임&#10;허민 프로"></textarea>
      </div>
      <div class="pblock">
        <div class="plabel ag"><span class="dot"></span>아이포유웍스 (에이전시)</div>
        <textarea id="apx" placeholder="오선민 팀장&#10;김경주 선임매니저&#10;김서영 매니저&#10;권정태 매니저"></textarea>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-label">회의 내용</div>
    <div class="form-group">
      <label>클로바노트 텍스트 전체 붙여넣기</label>
      <div class="ta-wrap">
        <textarea id="tx" placeholder="클로바노트에서 복사한 회의 전문을 여기에 붙여넣으세요." oninput="updateCount()"></textarea>
        <div class="char-count" id="cc">0자</div>
      </div>
    </div>
    <div class="tip">💡 클로바노트 공유 링크 열기 → 전체 선택(Ctrl+A) → 복사 → 위 박스에 붙여넣기 → 생성 버튼 클릭</div>
  </div>
  <button class="btn-gen" id="btngen" onclick="run()">⚡ 회의록 자동 생성</button>
  <div class="status-area" id="sta">
    <div class="sbox"><div class="steps" id="stps"></div></div>
    <div class="errbox" id="errmsg"></div>
  </div>
  <div class="preview-area" id="pva">
    <div class="pbox">
      <div class="phead">
        <span class="ptitle">PREVIEW · 생성된 회의록</span>
        <button class="btn-dl" id="btndl">↓ DOCX 다운로드</button>
      </div>
      <div class="pcontent" id="pvc"></div>
    </div>
  </div>
</div>
<script>

let gBlob=null,gMins=null;

function updateCount(){
  const v=document.getElementById('tx').value;
  document.getElementById('cc').textContent=v.length.toLocaleString()+'자';
}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function renderSteps(arr){
  document.getElementById('stps').innerHTML=arr.map((s,i)=>
    `<div class="step" id="st${i}"><div class="sicon" id="si${i}">${i+1}</div><span>${s}</span></div>`
  ).join('');
}

function setStep(i,state){
  const el=document.getElementById('st'+i),ic=document.getElementById('si'+i);
  if(!el)return;
  el.className='step '+state;
  if(state==='active')ic.innerHTML='<div class="spin"></div>';
  else if(state==='done')ic.textContent='✓';
  else if(state==='err')ic.textContent='✕';
  else ic.textContent=i+1;
}

function showError(msg){
  const e=document.getElementById('errmsg');
  e.style.display='block';
  e.textContent='오류: '+msg;
  document.querySelectorAll('.step.active').forEach(el=>{
    el.className='step err';
    el.querySelector('.sicon').textContent='✕';
  });
}

async function run(){
  const client=document.getElementById('client').value.trim();
  const author=document.getElementById('author').value.trim();
  const title=document.getElementById('title').value.trim();
  let date=document.getElementById('date').value.trim();
  const cpx=document.getElementById('cpx').value.trim();
  const apx=document.getElementById('apx').value.trim();
  const tx=document.getElementById('tx').value.trim();

  if(!tx){alert('회의록 텍스트를 입력해주세요.');return;}
  if(!author){alert('작성자를 입력해주세요.');return;}

  if(!date){
    const d=new Date();
    date=`${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
    document.getElementById('date').value=date;
  }

  const btn=document.getElementById('btngen');
  btn.disabled=true;
  document.getElementById('sta').classList.add('on');
  document.getElementById('pva').classList.remove('on');
  document.getElementById('errmsg').style.display='none';

  const steps=['AI 회의록 분석 중','주제별 내용 구조화','액션 아이템 분류','DOCX 문서 생성'];
  renderSteps(steps);

  try{
    setStep(0,'active');
    let parsed;
    let usedAI=false;
    try{
      const raw=await callAPI(client,author,date,title,cpx,apx,tx);
      parsed=parseJSON(raw);
      usedAI=true;
    }catch(apiErr){
      // CORS or network error = running as local file
      const isCORS=apiErr.message.includes('Failed to fetch')||apiErr.message.includes('NetworkError')||apiErr.message.includes('CORS');
      if(isCORS){
        document.getElementById('errmsg').style.display='block';
        document.getElementById('errmsg').style.background='rgba(245,158,11,.07)';
        document.getElementById('errmsg').style.borderColor='rgba(245,158,11,.3)';
        document.getElementById('errmsg').style.color='#fbbf24';
        document.getElementById('errmsg').textContent='⚠️ AI 분석 불가 (로컬 파일 실행 중). Netlify에 업로드하면 Claude AI가 회의록을 자동 요약합니다. 지금은 기본 파싱으로 진행합니다.';
      }
      console.warn('API fallback:',apiErr.message);
      parsed=localProcess(tx,title);
    }

    setStep(0,'done');setStep(1,'active');await delay(200);
    setStep(1,'done');setStep(2,'active');await delay(200);
    setStep(2,'done');setStep(3,'active');

    gMins={...parsed,client,author,date,title:title||parsed.title,cpx,apx};
    gBlob=await makeDocx(gMins);

    setStep(3,'done');
    showPreview(gMins);
    document.getElementById('btndl').onclick=()=>dlDocx(gBlob,gMins);
  }catch(err){
    showError(err.message||String(err));
  }finally{
    btn.disabled=false;
  }
}

async function callAPI(client,author,date,title,cpx,apx,tx){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:2000,
      system:`기업 내부 회의록 처리 AI. JSON만 응답. 마크다운 없이 순수 JSON.`,
      messages:[{role:'user',content:`회의 분석 후 JSON 변환.
고객사:${client} | 에이전시:아이포유웍스 | 날짜:${date}
날짜 m/d 형식 변환(3월19일→3/19), 구어체 제거, 명사형 간결 문장
HL그룹담당→hl_tasks, 아이포유웍스담당→i4u_tasks

{"title":"제목","purpose":"목적","topics":[{"title":"주제","items":["항목"]}],"hl_tasks":["업무"],"i4u_tasks":["업무"]}

회의록:
${tx.substring(0,7000)}`}]
    })
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'API '+res.status);}
  const d=await res.json();
  return(d.content||[]).map(b=>b.text||'').join('').trim();
}

function parseJSON(raw){
  try{return JSON.parse(raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim());}
  catch{return localProcess(raw,'');}
}

function localProcess(tx,title){
  // Normalize dates: 3월 19일 -> 3/19
  tx=tx.replace(/(\d{1,2})월\s*(\d{1,2})일/g,(_,m,d)=>m+'/'+d);

  // Strip clovanote speaker lines: "홍길동  00:00" or "홍길동: " patterns
  const cleanLines=tx.split('\n')
    .map(l=>l.trim())
    .filter(l=>l.length>1);

  // Separate speaker utterances from structural content
  // ClovaNote format: "발화자명  00:00\n내용" or "발화자명: 내용"
  const utterances=[];
  let i=0;
  while(i<cleanLines.length){
    const line=cleanLines[i];
    // Skip pure timestamp lines or speaker+timestamp headers
    if(/^\d{2}:\d{2}(:\d{2})?$/.test(line)){i++;continue;}
    if(/^[가-힣A-Za-z\s]{1,10}\s+\d{2}:\d{2}/.test(line)){i++;continue;}
    // Speaker label "이름: 내용" - extract content
    const speakerMatch=line.match(/^[가-힣A-Za-z\s]{1,8}[：:]\s*(.+)/);
    if(speakerMatch){
      if(speakerMatch[1].trim().length>2) utterances.push(speakerMatch[1].trim());
      i++;continue;
    }
    // Normal content line
    if(line.length>2) utterances.push(line);
    i++;
  }

  // Group into topics by detecting topic-like sentences
  // Topic signals: numbered items, ■, keywords like "관련", "건", "일정", "진행"
  const topics=[];
  const hlTasks=[], i4uTasks=[];
  let curTopic=null;

  // Try to find natural topic boundaries
  const topicKeywords=/캘린더|일정|콘텐츠|신규|인사|이동|예산|비용|촬영|디자인|기획|협의|확인|정기|임원|킥오프/;

  for(const line of utterances){
    // Detect action items by keywords
    const isHL=/HL|고객사|클라이언트|팀장님|담당|내부\s*확인|내부\s*논의/.test(line);
    const isI4U=/아이포유|I4U|에이전시|저희가|저희\s*쪽|우리가\s*/.test(line);
    const isAction=/진행\s*예정|확인\s*필요|전달\s*예정|작업\s*예정|검토\s*필요|논의\s*예정|발송|배포|제작|섭외|촬영\s*진행|업로드/.test(line);

    // Shorten long sentences to noun-phrase style (basic truncation)
    let item=line;
    // Remove filler
    item=item.replace(/그래서\s*|그리고\s*|아\s+|네\s+|음\s+|저\s+/g,'');
    item=item.replace(/[이가은는을를]\s*있습니다\.?/g,'').trim();
    item=item.replace(/것\s*같습니다\.?/g,'').trim();
    item=item.replace(/하도록\s*하겠습니다\.?/g,'').trim();
    item=item.replace(/예정입니다\.?/g,'예정').trim();
    item=item.replace(/진행합니다\.?/g,'진행').trim();
    item=item.replace(/확인하겠습니다\.?/g,'확인').trim();
    if(item.length<2) continue;

    if(isAction&&isHL) hlTasks.push(item);
    else if(isAction&&isI4U) i4uTasks.push(item);
    else{
      // Group into topics
      if(!curTopic||topicKeywords.test(item)&&item.length<30){
        // Start new topic if this looks like a header
        if(!curTopic||curTopic.items.length>6){
          const tTitle=curTopic?'기타 논의 사항':'회의 내용';
          curTopic={title:tTitle,items:[]};
          topics.push(curTopic);
        }
      }
      if(!curTopic){curTopic={title:'회의 내용',items:[]};topics.push(curTopic);}
      if(curTopic.items.length<8) curTopic.items.push(item);
    }
  }

  // If no topics found, chunk utterances into groups of ~6
  if(!topics.length||topics[0].items.length===0){
    const chunks=[];
    for(let j=0;j<Math.min(utterances.length,30);j+=6){
      chunks.push({title:j===0?'주요 논의 내용':`논의 내용 ${Math.floor(j/6)+1}`,
        items:utterances.slice(j,j+6).map(l=>{
          let s=l.replace(/그래서\s*|그리고\s*|아\s+|네\s+|음\s+/g,'').trim();
          return s.length>60?s.substring(0,60)+'…':s;
        }).filter(s=>s.length>2)
      });
    }
    return{title:title||'월간 합동 미팅',purpose:'월간 콘텐츠 기획 및 진행 상황 공유',
      topics:chunks.slice(0,5),hl_tasks:hlTasks.slice(0,8),i4u_tasks:i4uTasks.slice(0,8)};
  }

  return{title:title||'월간 합동 미팅',purpose:'월간 콘텐츠 기획 및 진행 상황 공유',
    topics:topics.slice(0,6),hl_tasks:hlTasks.slice(0,8),i4u_tasks:i4uTasks.slice(0,8)};
}


function showPreview(m){
  let h='';
  h+=`<span class="st">MEETING MINUTES</span>`;
  h+=`<span style="color:var(--text-muted)">고객사 </span>${m.client}   <span style="color:var(--text-muted)">작성자 </span>${m.author}   <span style="color:var(--text-muted)">작성일 </span>${m.date}\n`;
  h+=`<span style="color:var(--text-muted)">제목 </span>${m.title||''}\n\n`;
  h+=`<span class="st">참석자</span><span class="bl">▶ ${m.client}</span>\n${m.cpx||'-'}\n\n<span class="gr">▶ 아이포유웍스</span>\n${m.apx||'-'}\n\n`;
  h+=`<span class="st">회의목적</span>${m.purpose||''}\n\n`;
  h+=`<span class="st">회의내용</span>`;
  (m.topics||[]).forEach((t,i)=>{
    h+=`<strong>${i+1}. ${t.title}</strong>\n`;
    (t.items||[]).forEach(it=>{h+=`  • ${it}\n`;});
    h+='\n';
  });
  h+=`<span class="st">ACTION ITEMS</span><span class="bl">■ HL그룹 담당</span>\n`;
  (m.hl_tasks||[]).forEach(t=>{h+=`  <span class="bl">• ${t}</span>\n`;});
  h+=`\n<span class="gr">■ 아이포유웍스 담당</span>\n`;
  (m.i4u_tasks||[]).forEach(t=>{h+=`  <span class="gr">• ${t}</span>\n`;});
  document.getElementById('pvc').innerHTML=h;
  document.getElementById('pva').classList.add('on');
}

async function makeDocx(m){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
         AlignmentType,WidthType,BorderStyle,ShadingType,VerticalAlign}=window.docx;

  const F='나눔고딕',BL='0070C0',GR='00B050',BK='000000';
  // CRITICAL: margins must be plain numbers, no {value,type} object
  const MAR={top:100,bottom:100,left:100,right:100};
  const topB={style:BorderStyle.SINGLE,size:16,color:'919191'};
  const btmB={style:BorderStyle.SINGLE,size:8,color:'919191'};
  const nilB={style:BorderStyle.NIL};

  function bdr(t,b){return{top:t,bottom:b,left:nilB,right:nilB};}
  const outerB=bdr(topB,btmB),innerB=bdr(btmB,btmB),btmOnly=bdr(nilB,btmB);

  function kr(text,opts={}){
    return new TextRun({text,font:{name:F},size:opts.sz||20,bold:!!opts.bold,color:opts.color||BK});
  }
  function lbl(text,w,borders){
    return new TableCell({width:{size:w,type:WidthType.DXA},borders,margins:MAR,
      shading:{fill:'F2F2F2',type:ShadingType.CLEAR,color:'000000'},
      verticalAlign:VerticalAlign.CENTER,
      children:[new Paragraph({alignment:AlignmentType.CENTER,spacing:{line:275,lineRule:'auto'},
        children:[kr(text,{bold:true})]})]});
  }
  function val(paras,w,borders,span){
    return new TableCell({width:{size:w,type:WidthType.DXA},borders,margins:MAR,
      columnSpan:span,shading:{fill:'auto',type:ShadingType.CLEAR,color:'000000'},
      verticalAlign:VerticalAlign.CENTER,children:paras});
  }
  function p(text,opts={}){
    return new Paragraph({spacing:{line:275,lineRule:'auto'},children:[kr(text,opts)]});
  }
  function pRuns(runs){return new Paragraph({spacing:{line:275,lineRule:'auto'},children:runs});}
  function empty(){return new Paragraph({children:[]});}

  const LW=1058,CW=8530,R1=[1058,1656,1021,2798,1093,1962];

  const cpLines=(m.cpx||'').split('\n').filter(Boolean);
  const apLines=(m.apx||'').split('\n').filter(Boolean);
  function pGroup(head,lines,color){
    const a=[p(head,{bold:true,color})];
    lines.forEach(l=>a.push(p('- '+l)));
    return a;
  }

  const contentParas=[];
  (m.topics||[]).forEach((t,i)=>{
    contentParas.push(p(`${i+1}. ${t.title}`,{bold:true}));
    (t.items||[]).forEach(it=>contentParas.push(p('- '+it)));
    contentParas.push(empty());
  });
  contentParas.push(pRuns([kr('■ HL그룹 진행',{bold:true,color:BL})]));
  (m.hl_tasks||[]).forEach(t=>contentParas.push(p('- '+t,{color:BL})));
  contentParas.push(empty());
  contentParas.push(pRuns([kr('■ 아이포유웍스 진행',{bold:true,color:GR})]));
  (m.i4u_tasks||[]).forEach(t=>contentParas.push(p('- '+t,{color:GR})));

  const tbl=new Table({
    width:{size:9588,type:WidthType.DXA},columnWidths:R1,
    rows:[
      new TableRow({height:{value:250},children:[
        lbl('고객사',R1[0],outerB),val([p(m.client)],R1[1],outerB),
        lbl('작성자',R1[2],outerB),val([p(m.author)],R1[3],outerB),
        lbl('작성일자',R1[4],outerB),val([p(m.date)],R1[5],outerB),
      ]}),
      new TableRow({height:{value:250},children:[lbl('제목',LW,innerB),val([p(m.title||'')],CW,innerB,5)]}),
      new TableRow({children:[lbl('참석자',LW,innerB),val([...pGroup(m.client,cpLines,BL),empty(),...pGroup('아이포유웍스',apLines,GR)],CW,innerB,5)]}),
      new TableRow({children:[lbl('회의목적',LW,innerB),val([p(m.purpose||'')],CW,innerB,5)]}),
      new TableRow({children:[lbl('회의내용',LW,innerB),val([p('주제별 내용 정리')],CW,innerB,5)]}),
      new TableRow({children:[val([empty()],LW,innerB),val([pRuns([kr('■ HL 진행  ',{bold:true,color:BL}),kr('■ 아이포유 진행',{bold:true,color:GR})])],CW,innerB,5)]}),
      new TableRow({children:[val([empty()],LW,innerB),val(contentParas.length?contentParas:[empty()],CW,innerB,5)]}),
      new TableRow({children:[val([empty()],LW,btmOnly),val([new Paragraph({alignment:AlignmentType.RIGHT,spacing:{line:275,lineRule:'auto'},children:[kr('<끝>')]})],CW,btmOnly,5)]}),
    ]
  });

  const doc=new Document({sections:[{
    properties:{page:{size:{width:11906,height:16838},margin:{top:1080,bottom:1080,left:1080,right:1080}}},
    children:[new Paragraph({spacing:{line:275,lineRule:'auto'},children:[kr('MEETING MINUTES',{bold:true,sz:52})]}),empty(),tbl]
  }]});

  return await Packer.toBlob(doc);
}

function dlDocx(blob,m){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=(m.date||'').replace(/[.\s]/g,'').replace(/\//g,'-');
  a.download=`_I4U__${d}_HL_Meetingminutes.docx`;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
}

</script>
